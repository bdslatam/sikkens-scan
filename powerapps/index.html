<title>Sikkens Painting Process Scan</title>
<style>
:root{
  --ground:#eef1f3; --surface:#ffffff; --sunk:#e4e8ec; --ink:#1a2026; --ink2:#4c5763; --muted:#6c7782; --line:#d4dae0; --line2:#bfc7cf;
  --accent:#00569b; --accent-ink:#ffffff; --accent-soft:#e0edf7;
  --ok:#1b7f47; --ok-soft:#e1f2e8; --warn:#a86b00; --warn-soft:#fbefd6; --bad:#c0352b; --bad-soft:#f9e2df; --above:#6d5bd0; --above-soft:#ece9fb;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.06);
  --display:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --body:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#101418; --surface:#181e24; --sunk:#0c1013; --ink:#e6eaee; --ink2:#b3bdc7; --muted:#8d98a3; --line:#2a333c; --line2:#38434e;
  --accent:#4fb0e0; --accent-ink:#06121c; --accent-soft:#12283a; --ok:#4cc585; --ok-soft:#15301f; --warn:#e3a93a; --warn-soft:#352813; --bad:#f07466; --bad-soft:#3a1c19; --above:#a898ff; --above-soft:#26213f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#101418; --surface:#181e24; --sunk:#0c1013; --ink:#e6eaee; --ink2:#b3bdc7; --muted:#8d98a3; --line:#2a333c; --line2:#38434e;
  --accent:#4fb0e0; --accent-ink:#06121c; --accent-soft:#12283a; --ok:#4cc585; --ok-soft:#15301f; --warn:#e3a93a; --warn-soft:#352813; --bad:#f07466; --bad-soft:#3a1c19; --above:#a898ff; --above-soft:#26213f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-stretch:112%;line-height:1.1;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;overflow:hidden}
.logo{height:22px;width:auto;flex:none;padding:4px 6px;border-radius:6px;background:#fff;box-sizing:content-box}
.bname{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.bname b{font-size:13px!important;letter-spacing:.06em}
@media (max-width:520px){.brand .bname span{display:none}.logo{height:16px}.bname b{font-size:11px!important}.save span{font-size:12px}}
.brand b{font-family:var(--display);font-stretch:112%;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save[data-s="pending"] i,.save[data-s="saving"] i{background:var(--warn)}
.save[data-s="error"] i{background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* tabs */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:19;background:var(--ground);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;min-width:0}
.tab .t{font-size:14px;font-weight:600;white-space:nowrap}
.tab .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line2);box-shadow:var(--shadow)}
.tab .s.ok{color:var(--ok)} .tab .s.warn{color:var(--warn)} .tab .s.bad{color:var(--bad)}

main{padding-block:20px 80px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.notice{border:1px solid var(--line2);background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink2)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:20px}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--ink2);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.list{display:grid;gap:10px}
.scard{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:14px 16px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.scard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.scard h3{font-size:18px;font-weight:700;font-stretch:108%}
.scard .meta{font-size:14px;color:var(--muted)}
.scard .big{grid-row:1/3;grid-column:2;text-align:right}
.scard .big b{font-family:var(--mono);font-size:24px;display:block}
.scard .big small{font-size:12px;color:var(--muted)}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:6px}
.strip i{height:6px;border-radius:2px;background:var(--sunk)}
.empty{padding:40px 20px;text-align:center}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{padding:16px;display:grid;gap:14px}
.card + .card{margin-top:14px}
.card h2{font-size:20px;font-weight:700}
.sechead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:16px}
.sechead h1{font-size:clamp(24px,4vw,32px);font-weight:800}
.gauge{display:flex;align-items:center;gap:12px;min-width:220px;flex:1;max-width:360px}
.gauge .track{flex:1;height:10px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent);transition:width .25s}
.gauge b{font-family:var(--mono);font-size:22px;min-width:4.5ch;text-align:right}
.fill.ok,.dot.ok{background:var(--ok)} .fill.warn,.dot.warn{background:var(--warn)} .fill.bad,.dot.bad{background:var(--bad)}

.sub{margin:22px 0 8px;display:flex;gap:10px;align-items:baseline}
.sub .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sub h3{font-size:16px;font-weight:700;font-stretch:104%}
.items{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .q{font-weight:500}
.item .ex{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.item .ex .num{color:var(--ink2)}
.ctrl{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button + button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.clear{color:var(--muted);font-weight:400;padding-inline:9px}
.numin{display:flex;align-items:center;gap:6px}
.numin input{width:110px}
.numin span{font-size:13px;color:var(--muted);min-width:3ch}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.parcial{background:var(--warn-soft);color:var(--warn)} .chip.falha{background:var(--bad-soft);color:var(--bad)} .chip.acima{background:var(--above-soft);color:var(--above)} .chip.na{background:var(--sunk);color:var(--muted)}
.stat{width:92px;display:flex;justify-content:flex-end}
@media (max-width:640px){ .item{grid-template-columns:1fr} .ctrl{justify-content:flex-start} .stat{width:auto} }

/* staff */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--mono);font-size:22px;font-weight:600}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.people{display:grid;gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.person .top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.pct{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:6px;align-items:end}
.pct .field label,.more .field label{font-size:12px}
.pct input,.more input{padding:6px 8px;font-size:14px}
.sum{font-family:var(--mono);font-size:13px;padding:6px 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.sum.bad{background:var(--bad-soft);color:var(--bad)}
.more{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:6px;align-items:end}
.more label.chk{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
@media (max-width:640px){ .person .top{grid-template-columns:1fr 1fr} .person .top .del{grid-column:2;justify-self:end} .pct,.more{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* fotos */
.etapa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.etapa + .etapa{margin-top:12px}
.etapa-h{display:flex;align-items:baseline;gap:10px}
.etapa-h .n{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:15px}
.etapa-h h2{font-size:18px;font-weight:700;font-stretch:106%}
.etapa-h .cnt{margin-left:auto;font-size:13px}
.vazio{margin:0;font-size:14px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.foto{margin:0;display:grid;gap:8px;align-content:start;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--ground)}
.foto img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.foto textarea{min-height:56px;font-size:14px}
.foto .btn{justify-self:start}
label.btn{user-select:none}
.paper .rfotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:8px 0 16px}
.paper .rfotos figure{margin:0}
.paper .rfotos img{width:100%;height:auto;border-radius:3px;display:block;background:#eef1f3}
.paper .rfotos figcaption{font-size:13.5px;margin-top:6px;color:var(--p-ink)}
@media (max-width:520px){.paper .rfotos{grid-template-columns:1fr}}
/* plano */
.acoes{display:grid;gap:10px}
.paper table.plano td{height:30px}
/* report (paper stays light: it's a document preview) */
.rtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.paper{--p-ink:#1a2026;--p-mute:#5f6a75;--p-line:#d9dee3;background:#fff;color:var(--p-ink);border-radius:6px;box-shadow:var(--shadow);padding:clamp(20px,5vw,56px);max-width:860px;margin:0 auto}
.paper h1{font-size:34px;font-weight:800;font-stretch:118%}
.paper h2{font-size:22px;font-weight:800;margin:36px 0 12px;padding-top:14px;border-top:2px solid #00569b;display:flex;gap:10px}
.paper h2 span{font-family:var(--mono);font-weight:600;color:var(--p-mute)}
.paper h3{font-size:16px;font-weight:700;margin:20px 0 8px}
.paper p{max-width:68ch;margin:8px 0}
.paper .cover{display:grid;gap:4px;padding-bottom:18px}
.paper .cover dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:14px 0 0;font-size:15px}

.tbl{overflow-x:auto}
.paper table{border-collapse:collapse;width:100%;font-size:14px}
.paper th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--p-mute);border-bottom:1.5px solid var(--p-ink);padding:6px 8px}
.paper td{border-bottom:1px solid var(--p-line);padding:6px 8px;vertical-align:top}
.paper td.n,.paper th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.paper tr.st-falha td:first-child{box-shadow:inset 3px 0 #c0352b} .paper tr.st-parcial td:first-child{box-shadow:inset 3px 0 #b87800} .paper tr.st-ok td:first-child{box-shadow:inset 3px 0 #1b7f47} .paper tr.st-acima td:first-child{box-shadow:inset 3px 0 #6d5bd0}
.paper .chart{margin:10px 0;overflow-x:auto}
.paper .chart svg{display:block;max-width:100%;height:auto}
.paper .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--p-mute)}
.paper .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.paper .note{background:#f3f5f7;border-left:3px solid #00569b;padding:10px 14px;margin:12px 0;white-space:pre-wrap;font-size:14.5px}
.paper .toc{columns:2;column-gap:28px;font-size:15px;padding-left:20px}
@media (max-width:560px){.paper .toc{columns:1}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.langs{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.langs button{border:0;background:transparent;padding:5px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--ink2)}
.langs button + button{border-left:1px solid var(--line2)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.langs button{padding:4px 6px;font-size:11px}.save span{display:none}}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ===== barra lateral / base de dados ===== */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1320px;margin:0 auto;align-items:start}
.shell > main{min-width:0;width:100%}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px 48px;display:flex;flex-direction:column;gap:22px}
.side h4{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.side .sideform{display:grid;gap:10px}
.side .field label{font-size:12px}
.side select,.side input[type=text]{padding:6px 8px;font-size:14px}
.side .seg button{padding:6px 9px;font-size:13px}
.nav{display:grid;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink2)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav .c,.nav .s{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap}
.nav .s.ok{color:var(--ok)} .nav .s.warn{color:var(--warn)} .nav .s.bad{color:var(--bad)}
.menu-btn{font-size:18px;line-height:1;padding:6px 10px}
.scrim{display:none;border:0;padding:0;margin:0;position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:39;cursor:pointer}
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(300px,86vw);z-index:40;transform:translateX(-104%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .shell.open .side{transform:none}
  .shell.open .scrim{display:block}
}
@media (min-width:960px){ .shell.collapsed{grid-template-columns:minmax(0,1fr)} .shell.collapsed .side{display:none} .incan:not(.sidecol) .tabs{display:none} }
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:22px 0 8px}
.ghead:first-child{margin-top:0}
.ghead h2{font-size:19px;font-weight:800}
.ghead span{font-size:13px;color:var(--muted)}
.tchip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:1px}
.scard .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dtable{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.dtable th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--line2);padding:10px 12px;white-space:nowrap}
.dtable td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
/* plano */
.acao{display:grid;grid-template-columns:92px 124px minmax(0,1fr) 150px auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.acao[data-prio="alta"]{box-shadow:inset 4px 0 var(--bad)} .acao[data-prio="media"]{box-shadow:inset 4px 0 var(--warn)} .acao[data-prio="baixa"]{box-shadow:inset 4px 0 var(--ok)}

const FUNCOES = ["—","Mecânico/Montador","Funileiro","Preparador","Pintor","Lavador/Polidor","Motorista","Recepcionista","Administrativo/Orçamentista","Gerente"];
const MERCADO = { pol: 2, pint: 1.5, prep: 6, fun: 10.5, overhead: 0.25, competencia: 0.85, doenca: 0.07 };
const SECOES = [
  { key: "edif",   n: "4", t: "Edificação" },
  { key: "layout", n: "5", t: "Fluxo de trabalho & layout" },
  { key: "util",   n: "6", t: "Central de utilidades" },
  { key: "equip",  n: "7", t: "Equipamentos" },
  { key: "ferr",   n: "8", t: "Ferramentas" },

];
const isNum = v => typeof v === "number" && isFinite(v);
const toNum = v => (v === "" || v == null ? null : (isNum(+v) ? +v : null));

function computeStaff(scan) {
  const m = scan.meta || {};

  const t = m.turnos || {};
  const nT = toNum(t.n);
  const potDia = dSem ? dias * hSem / dSem : 0;                          // T12
  const potTurnoTot = (toNum(t.porDia) || 0) * (toNum(t.dias) || 0) * (toNum(t.horas) || 0); // T14
  const potTurno = nT ? potTurnoTot / nT : 0;                            // T13
  const rows = (scan.staff || []).map(p => {
    const f = k => toNum(p[k]) || 0;
    const L = f("comp"), M = f("disp"), N = f("doenca"), O = f("feriados"), P = f("extras");
    const prodPct = f("fun") + f("prep") + f("pint") + f("pol");
    const soma = prodPct + f("ger");

    else horas = ((potTurno - (N + O) * (toNum(t.horas) || 0)) * M / 100 * util + P) * L / 100;

      act: { fun: fte("fun"), prep: fte("prep"), pint: fte("pint"), pol: fte("pol") }, over: fte("ger"), L, N };
  });
  const sum = (arr, fn) => arr.reduce((a, x) => a + fn(x), 0);
  const fteProd = sum(rows, r => r.fteProd), fteOver = sum(rows, r => r.fteOver);
  const actTot = {}; ["fun", "prep", "pint", "pol"].forEach(k => actTot[k] = sum(rows, r => r.act[k]));
  const actSum = actTot.fun + actTot.prep + actTot.pint + actTot.pol;
  const mix = {}; for (const k in actTot) mix[k] = actSum ? actTot[k] / actSum : 0;
  const hProdTot = sum(rows, r => r.hProd), hOverTot = sum(rows, r => r.hOver);

  const fteAct = k => sum(rows.filter(r => !r.p.turno), r => r.act[k]) + (nT ? sum(rows.filter(r => r.p.turno), r => r.act[k]) / nT : 0);

  }).filter(x => x.pessoas);
  return { rows, hProdTot, potDia, potTurno, fteProd, fteOver, fteTotal, mix, hJob, hJobOver, perJob, fteMetal, ftePaint,
    fteFloor: fteMetal + ftePaint, competencia, overheadRatio, doenca, diasDoenca, porDia: dias ? carros / dias : 0,
    pessoas: rows.length, porFuncao, erros: rows.filter(r => r.soma > 0 && Math.abs(r.soma - 100) > 0.01).map(r => r.p.nome || "(sem nome)") };
}

function shouldFor(it, st, ans) {
  const s = it.std;
  switch (it.calc) {
    case "fixed": return s;
    case "round_prod": return Math.round(s * st.fteProd);
    case "int_metal": { const a = areaStalls(_scanMeta, st); if (a) return a.m; return st.fteMetal ? Math.floor(s * st.fteMetal) + 1 : 0; }
    case "int_paint": { const a = areaStalls(_scanMeta, st); if (a) return a.p; return st.ftePaint ? Math.floor(s * st.ftePaint) + 1 : 0; }
    case "int_paintm1": return st.ftePaint ? Math.floor(s * (st.ftePaint - 1)) + 1 : 0;
    case "per_func": { const n = st.rows.filter(r => (r.p.funcao | 0) === it.func).length; if (n) return n * s;
      const a = st.rows.reduce((x, r) => x + (it.func === 3 ? r.act.prep : r.act.pint), 0); return a ? Math.ceil(a - 1e-9) * s : 0; }
    case "int_paintp1": return st.ftePaint ? Math.floor(s * st.ftePaint + 1) : 0;
    case "sum_stalls": return ((toNum(ans["82"]) || 0) + (toNum(ans["83"]) || 0) + (toNum(ans["84"]) || 0)) * s;
    case "air": return ans["124"] === "Sim" ? 10 : ans["124"] === "Não" ? 7 : null;
    case "compressor": {
      if (!st.fteFloor) return 0;
      const pneu = ans["100"] === "Sim";
      let kw = 0.3 * st.fteMetal + (pneu ? 1.5 : 1) * st.ftePaint;
      if (kw < 4) kw = 4;
      return (ans["102u"] || "HP") === "kW" ? kw : kw / 0.736;
    }
  }
  return s;
}

function evalItem(it, st, ans) {
  const raw = ans[String(it.id)];
  if (it.kind === "yn") {
    if (!raw) return { answered: false, deficit: 0, should: it.exp, is: "" };
    const bad = it.exp === "Sim" ? "Não" : "Sim";
    const deficit = raw === bad ? it.w : raw === "Média" ? it.w / 2 : 0;
    return { answered: true, deficit, should: it.exp, is: raw, status: deficit === 0 ? "ok" : raw === "Média" ? "parcial" : "falha" };
  }
  const is = toNum(raw);
  const should = shouldFor(it, st, ans);
  if (is == null) return { answered: false, deficit: 0, should, is: null };
  let deficit = 0, acima = false;
  if (it.dir === "min") {
    if (is < should && should > 0) deficit = (should - is) / should * it.w * 2;
    acima = is > should;
  } else if (it.dir === "lamps") {
    if (is > should) deficit = (is - should) / it.w;
  } else if (it.dir === "air") {
    if (should && is > should) deficit = (is - should) / should * it.w;
  }
  return { answered: true, deficit, should, is, acima, status: deficit === 0 ? (acima ? "acima" : "ok") : deficit >= it.w ? "falha" : "parcial" };
}

let _scanMeta = {}, _scanAns = {};
function computeScan(scan, ITEMS) {
  _scanMeta = scan.meta || {}; _scanAns = scan.ans || {};
  const st = computeStaff(scan);
  const ans = scan.ans || {};
  const secs = SECOES.map(s => {
    const its = ITEMS.filter(x => x.sec === s.key && x.id && x.kind !== "info");
    let W = 0, D = 0, n = 0;
    const res = its.map(it => {
      const r = evalItem(it, st, ans);
      if (r.answered) { W += it.w; D += r.deficit; n++; }
      return { it, r };
    });
    return { ...s, score: W ? W / (W + D) : null, respondidos: n, total: its.length, res };
  });
  const melhorias = secs.flatMap(s => s.res.filter(x => x.r.deficit > 0).map(x => ({ sec: s, ...x })))
    .sort((a, b) => b.r.deficit - a.r.deficit);
  const scored = secs.filter(s => s.score != null);
  const geral = scored.length ? scored.reduce((a, s) => a + s.score, 0) / scored.length : null;
  return { st, secs, melhorias, geral };
}

  intro1:["O Sikkens Painting Process Scan é uma ferramenta de análise da oficina e dos seus métodos de trabalho. Ele mostra os pontos fortes e fracos e serve de base para uma estratégia de melhoria.","El Sikkens Painting Process Scan es una herramienta de análisis del taller y de sus métodos de trabajo. Muestra los puntos fuertes y débiles y sirve de base para una estrategia de mejora.","The Sikkens Painting Process Scan is a tool to analyse the bodyshop and its working methods. It shows strengths and weaknesses and serves as a basis for an improvement strategy.","Le Sikkens Painting Process Scan est un outil d’analyse de l’atelier et de ses méthodes de travail. Il met en évidence les points forts et faibles et sert de base à une stratégie d’amélioration."],
  intro2:["Uma pontuação de 100% significa que todas as referências foram atendidas. As páginas seguintes detalham, item a item, o que foi observado (“É”) e a referência (“Deveria”).","Una puntuación del 100 % significa que se cumplen todas las referencias. Las páginas siguientes detallan, ítem por ítem, lo observado (“Es”) y la referencia (“Debería”).","A 100% score means all standards are met. The following pages detail, item by item, what was observed (“Is”) and the standard (“Should be”).","Une note de 100 % signifie que toutes les références sont atteintes. Les pages suivantes détaillent, point par point, ce qui a été observé (« Est ») et la référence (« Devrait »)."],

const localStore = {
  all(){ return LS.get("ss-scans-"+S.country) || {}; },
  put(id, body){ const a=this.all(); a[id]=body; LS.set("ss-scans-"+S.country, a); },
  del(id){ const a=this.all(); delete a[id]; LS.set("ss-scans-"+S.country, a); }
};
function listFromLocal(){ const a=localStore.all(); S.list = Object.entries(a).map(([id,d])=>({id,d})).sort((x,y)=>(y.d.updatedAt||"").localeCompare(x.d.updatedAt||"")); }
async function boot(){
  render();
  if(!(window.claude && window.claude.use)){ await bootStandalone(); return; }
  const use = n => { try{ return (window.claude && window.claude.use) ? Promise.resolve(window.claude.use(n)).catch(()=>null) : Promise.resolve(null); }catch(e){ return Promise.resolve(null); } };
  const [db, assets, downloads] = await Promise.all([use("db"), use("assets"), use("downloads")]);
  S.db=db; S.assets=assets; S.downloads=downloads; S.mode = db ? "db" : "local";
  if(db){
    try{ db.collection("indice").onSnapshot(snap=>{ S.index={}; snap.docs.forEach(d=>S.index[d.id]=d.data()); if(!S.country) render(); else if(S.view==="paises") refreshHome(); }, ()=>{}); }catch(e){}
  } else S.index = LS.get("ss-index") || {};
  S.ready=true; render();
}
let saveTimer=null, saving=Promise.resolve();
function markDirty(){ S.dirty=true; S.scan.updatedAt=new Date().toISOString(); setSave("pending"); clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700); }
function flush(){
  if(!S.cur || !S.dirty) return saving;
  const id=S.cur, body=JSON.parse(JSON.stringify(S.scan)); S.dirty=false; setSave("saving");
  saving = saving.then(async()=>{
    try{
      if(S.mode==="db") await S.db.doc(colScans()+"/"+id).set(body); else { localStore.put(id, body); upsertLocalList(S.list, id, body); queueIndex(); }
      if(!S.dirty) setSave("saved");
    }catch(e){ S.dirty=true; setSave("error"); if(e && e.code==="quota_exceeded") toast(t("Limite de scans atingido — exclua scans antigos.")); }
  });
  return saving;
}
function setSave(s){ S.save=s; const el=document.getElementById("save"); if(el){ el.dataset.s=s; el.querySelector("span").textContent = {saved:S.mode==="db"?t("saved"):t("savedLocal"),pending:t("pending"),saving:t("saving"),error:t("saveErr")}[s]; } }
async function openScan(id, body){
  await flush();
  if(S.unsubDoc){ S.unsubDoc(); S.unsubDoc=null; }
  S.cur=id; S.scan=JSON.parse(JSON.stringify(body)); S.scan.meta.turnos=S.scan.meta.turnos||{}; S.scan.ans=S.scan.ans||{}; S.scan.notes=S.scan.notes||{}; S.scan.staff=S.scan.staff||[];
  S.tab = (LS.get("ss-tab-"+id)) || "geral"; S.confirmDel=false; S.dirty=false; S.save="saved";
  if(S.mode==="db"){
    S.unsubDoc = S.db.doc(colScans()+"/"+id).onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites || S.dirty || S.cur!==id) return;
      const d=snap.data(); if((d.updatedAt||"") > (S.scan.updatedAt||"")){ S.scan=JSON.parse(JSON.stringify(d)); renderBody(); toast(t("Atualizado por outra pessoa.")); }
    }, ()=>{});
  }
  render(); window.scrollTo(0,0);
}
async function createScan(body){
  body.meta.paisCod=S.country; body.meta.pais=cNamePt(S.country);
  const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{ if(S.mode==="db") await S.db.doc(colScans()+"/"+id).set(body); else localStore.put(id, body); }
  catch(e){ toast(e && e.code==="quota_exceeded" ? t("Limite de scans atingido — exclua scans antigos.") : t("Não foi possível criar o scan.")); return; }
  if(S.mode==="local") listFromLocal();
  openScan(id, body);
}
async function deleteScan(){
  if(!S.admin){ toast(t("adminOnly")); return; }
  const id=S.cur, fotos=(S.scan&&S.scan.fotos)||[]; if(S.unsubDoc){S.unsubDoc();S.unsubDoc=null;} S.cur=null; S.scan=null; S.dirty=false;
  for(const f of fotos){ try{ await deletePhotoAny(f); }catch(e){} }
  try{ if(S.mode==="db") await S.db.doc(colScans()+"/"+id).delete(); else { localStore.del(id); listFromLocal(); } toast(t("Scan excluído.")); }catch(e){ toast(t("Não foi possível excluir.")); }
  render();
}
async function goHome(){ await flush(); if(S.unsubDoc){S.unsubDoc();S.unsubDoc=null;} S.cur=null; S.scan=null; if(S.mode==="local") listFromLocal(); render(); window.scrollTo(0,0); }

/* ================= caminhos / binding ================= */
function getPath(o, p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k], o); }
function setPath(o, p, v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null) a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }

const app = document.getElementById("app");
function render(){
  if(!S.country){ app.className="entry"; app.innerHTML = topBar() + entryView(); return; }
  app.className = (S.cur ? "incan" : "") + (S.sideCollapsed ? " sidecol" : "");
  const shell = inner => `<div class="shell${S.sideOpen?" open":""}${S.sideCollapsed?" collapsed":""}"><aside class="side" id="side" aria-label="${t("nav_db")}">${S.cur?scanSide():homeSide()}</aside><button type="button" class="scrim" data-act="side-close" aria-label="${t("closeMenu")}"></button>${inner}</div>`;
  if(!S.cur){ app.innerHTML = topBar() + shell(`<main class="wrap" id="home">${homeView()}</main>`); return; }
  app.innerHTML = topBar() + `<nav class="tabs" aria-label="${t("sections")}"><div class="wrap" id="tabs"></div></nav>` + shell(`<main class="wrap" id="body"></main>`);
  renderTabs(); renderBody();
}
function renderBody(){
  const el=document.getElementById("body"); if(!el) return;
  if(S.tab==="plano"||S.tab==="relatorio") syncPlano();
  if(S.tab==="geral") el.innerHTML=geralView();
  else if(S.tab==="equipe") el.innerHTML=equipeView();
  else if(S.tab==="relatorio") el.innerHTML=reportView();
  else if(S.tab==="fotos") el.innerHTML=fotosView();
  else if(S.tab==="plano") el.innerHTML=planoView();
  else el.innerHTML=secView(S.tab);
  el.insertAdjacentHTML("beforeend", sectionNav());
  setSave(S.save); live();
}
function inp(path, type="text", extra=""){ const v=getPath(S.scan,path); return `<input type="${type}" id="f-${path.replace(/\./g,"-")}" data-bind="${path}" data-type="${type}" value="${esc(v??"")}" ${type==="number"?'inputmode="decimal" step="any"':""} ${extra}>`; }
function fld(label, path, type="text", hint="", extra=""){ return `<div class="field"><label for="f-${path.replace(/\./g,"-")}">${label}</label>${inp(path,type,extra)}${hint?`<span class="hint">${hint}</span>`:""}</div>`; }

app.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="entry-country"){ S.pickCountry=el.value; return; }
  if(el.dataset.filter){ S.f[el.dataset.filter]=el.value; LS.set("ss-f", S.f); rerenderHome(); return; }
  if(el.dataset.cbind){ if(S.cliDraft) setPath(S.cliDraft, el.dataset.cbind, el.value); return; }
  if(el.dataset.cli && S.scan){ linkClient(el.value); return; }
  const p=el.dataset.bind; if(!p || !S.scan) return;
  let v=el.value;
  if(el.dataset.type==="number") v = v===""?"":(isFinite(+v)?+v:v);
  if(el.dataset.type==="int") v = parseInt(v,10)||0;
  if(el.dataset.type==="bool") v = el.checked;
  setPath(S.scan, p, v);
  const mm=p.match(/^plano\.(\d+)\.(acao|qtd|prio)$/);
  if(mm){ const a=S.scan.plano[+mm[1]];
    if(mm[2]==="acao") a.edited=true;
    if(mm[2]==="qtd" && a.auto && !a.edited){ regenAuto(a); const ta=document.getElementById(`f-plano-${mm[1]}-acao`); if(ta) ta.value=a.acao; }
    if(mm[2]==="prio"){ const box=el.closest(".acao"); if(box) box.dataset.prio=v; }
  }
  markDirty(); live();
  if(p==="meta.oficina"){ const b=document.querySelector(".brand span"); if(b) b.textContent=v||t("unnamed"); }
});
app.addEventListener("change", e=>{ const t=e.target; if(t.dataset.photo && t.files.length){ addPhotos(Array.from(t.files), +t.dataset.photo); t.value=""; return; } if(t.id==="xlsfile" && t.files[0]) importXls(t.files[0]); else if(t.dataset.type==="bool"||t.tagName==="SELECT") { /* handled by input */ } });
app.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lang){ setLang(b.dataset.lang); return; }
  if(b.dataset.pick){ const i=document.getElementById("gal-"+b.dataset.pick); if(i){ i.value=""; i.click(); } return; }
  if(b.dataset.cam){ openCamera(+b.dataset.cam); return; }
  if(b.dataset.delask){ S.delAsk=b.dataset.delask; rerenderHome(); return; }
  if(b.dataset.delno){ S.delAsk=null; rerenderHome(); return; }
  if(b.dataset.delyes){ const [k,id]=[b.dataset.delyes.slice(0,1), b.dataset.delyes.slice(2)]; if(k==="s") deleteScanById(id); else deleteClientById(id); return; }
  if(b.dataset.open){ const r=S.list.find(x=>x.id===b.dataset.open); if(r) openScan(r.id, r.d); return; }
  if(b.dataset.view){ S.delAsk=null; S.view=b.dataset.view; LS.set("ss-view",S.view); S.cliEdit=null; S.sideOpen=false; render(); window.scrollTo({top:0}); return; }
  if(b.dataset.group){ S.group=b.dataset.group; LS.set("ss-group",S.group); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); rerenderHome(); return; }
  if(b.dataset.cliopen){ openClient(b.dataset.cliopen); return; }
  if(b.dataset.enter){ S.view="scans"; LS.set("ss-view","scans"); enterCountry(b.dataset.enter); return; }
  if(b.dataset.tab){ S.sideOpen=false; const sh=document.querySelector(".shell"); if(sh) sh.classList.remove("open"); await flush(); S.tab=b.dataset.tab; LS.set("ss-tab-"+S.cur, S.tab); renderBody(); window.scrollTo({top:0}); return; }
  if(b.dataset.seg){ const p=b.dataset.seg, v=b.dataset.val; setPath(S.scan,p,v); b.parentElement.querySelectorAll("button[data-val]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.val===v && v!==""))); markDirty();
    if(p==="ans.102u"){ const u=document.querySelector("#f-ans-102 + span"); if(u) u.textContent=v; }
    live(); return; }
  if(b.dataset.rmacao!=null){ const a=S.scan.plano.splice(+b.dataset.rmacao,1)[0]; if(a&&a.item){ S.scan.planoIgn=[...new Set([...(S.scan.planoIgn||[]),a.item])]; } markDirty(); renderBody(); return; }
  if(b.dataset.rmfoto!=null){ const i=+b.dataset.rmfoto; if(S.confirmFoto===i) removePhoto(i); else { S.confirmFoto=i; renderBody(); } return; }
  if(b.dataset.rm!=null){ S.scan.staff.splice(+b.dataset.rm,1); markDirty(); renderBody(); return; }
  switch(b.dataset.act){
    case "home": goHome(); break;
    case "new": createScan(blankScan()); break;
    case "import": document.getElementById("xlsfile").click(); break;
    case "addp": S.scan.staff.push({nome:"",funcao:0,fun:0,prep:0,pint:0,pol:0,ger:0,comp:100,disp:100,doenca:0,feriados:0,extras:0,turno:false}); markDirty(); renderBody();
      setTimeout(()=>{ const i=S.scan.staff.length-1; const el=document.getElementById(`f-staff-${i}-nome`); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } },0); break;
    case "del": S.confirmDel=true; renderBody(); break;
    case "del-no": S.confirmDel=false; renderBody(); break;
    case "del-yes": deleteScan(); break;
    case "dup": { const n=JSON.parse(JSON.stringify(S.scan)); n.meta.data=new Date().toISOString().slice(0,10); n.createdAt=n.updatedAt=new Date().toISOString(); n.notes={}; n.fotos=[]; n.plano=[]; n.previousOf=S.cur; await flush(); createScan(n); toast(t("Revisita criada.")); break; }
    case "docx": exportDocx(b); break;
    case "addacao": S.scan.plano=S.scan.plano||[]; S.scan.plano.push({acao:"",resp:"",prazo:""}); markDirty(); renderBody();
      setTimeout(()=>{ const el=document.getElementById(`f-plano-${S.scan.plano.length-1}-acao`); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } },0); break;
    case "refresh": S.scan.planoIgn=[]; syncPlano(); markDirty(); renderBody(); toast(t("refreshed")); break;
    case "side": { const sh=document.querySelector(".shell");
      if(window.innerWidth>=960){ S.sideCollapsed=!S.sideCollapsed; LS.set("ss-sidecol",S.sideCollapsed); if(sh) sh.classList.toggle("collapsed",S.sideCollapsed); app.classList.toggle("sidecol",S.sideCollapsed); b.setAttribute("aria-expanded",String(!S.sideCollapsed)); }
      else { S.sideOpen=!S.sideOpen; if(sh) sh.classList.toggle("open", S.sideOpen); }
      break; }
    case "enter": tryEnter(); break;
    case "logout": logoutAll(); break;
    case "country": goEntry(); break;
    case "side-close": { S.sideOpen=false; const sh=document.querySelector(".shell"); if(sh) sh.classList.remove("open"); break; }
    case "clearf": S.f={}; LS.set("ss-f",S.f); render(); break;
    case "newcli": openClient(null); S.cliEdit="new"; render(); break;
    case "cli-save": saveClient(); break;
    case "cli-cancel": S.cliEdit=null; S.cliDraft=null; render(); break;
    case "cli-del": S.cliConfirmDel=true; rerenderHome(); break;
    case "cli-del-no": S.cliConfirmDel=false; rerenderHome(); break;
    case "cli-del-yes": deleteClient(); break;
    case "cli-newscan": scanForClient(S.cliEdit); break;
    case "cli-import": importClients(); break;
    case "cli-from-scan": cliFromScan(); break;
    case "pdf": exportPdf(b); break;
  }
});

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
async function importXls(file){
  toast(t("Lendo planilha…"));
  try{
    if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await file.arrayBuffer(), {type:"array"});
    const sh=wb.Sheets["Entrada de Dados"]; if(!sh) throw new Error(t("A planilha não tem a aba “Entrada de Dados”."));
    const v=(r,c)=>{ const x=sh[XLSX.utils.encode_cell({r,c})]; return x? x.v : ""; };
    const num=x=> typeof x==="number" ? x : "";
    const iso=x=>{ if(typeof x==="string"){ const g=x.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); return g?`${g[3]}-${g[2].padStart(2,"0")}-${g[1].padStart(2,"0")}`:""; } if(typeof x!=="number"||x<=0) return ""; const d=new Date(Date.UTC(1899,11,30)+Math.round(x)*864e5); return d.toISOString().slice(0,10); };
    const scan=blankScan();
    Object.assign(scan.meta,{ oficina:String(v(4,2)||"").trim(), cidade:String(v(5,2)||"").trim(), data:iso(v(6,2))||scan.meta.data, realizadoPor:String(v(7,2)||"").trim(), periodoInicio:iso(v(8,4)),
      diasObservados:num(v(10,4)), horasSemana:num(v(11,4)), diasSemana:num(v(12,4)), carros:num(v(9,19)), utilizacao:num(v(10,19))||0.9,
      turnos:{ n:num(v(10,12)), porDia:num(v(11,12)), dias:num(v(12,12)), horas:num(v(13,12)) } });
    scan.staff=[];
    for(let r=17;r<62;r++){
      const nome=String(v(r,1)||"").trim(); const ps=[4,5,6,7,9].map(c=>num(v(r,c))||0);
      if(!nome && !ps.some(Boolean)) continue;
      const fn=num(v(r,32));
      scan.staff.push({nome, funcao: fn && fn<10 ? fn|0 : 0, fun:ps[0],prep:ps[1],pint:ps[2],pol:ps[3],ger:ps[4], comp:num(v(r,11))||0, disp:num(v(r,12))||0, doenca:num(v(r,13))||0, feriados:num(v(r,14))||0, extras:num(v(r,15))||0, turno: v(r,30)===true});
    }
    const yn=id=>{ const a=v(id-1,28)===true, d=v(id-1,29)===true; return a&&!d?"Sim":d&&!a?"Não":a&&d?"Média":""; };
    ITEMS.forEach(it=>{ if(!it.id) return; if(it.kind==="num"){ const x=v(it.id-1,18); scan.ans[it.id]= typeof x==="number"?x:""; } else scan.ans[it.id]=yn(it.id); });
    scan.ans["100"]=yn(100)||"Não"; scan.ans["102u"]= yn(102)==="Sim" ? "kW" : "HP";
    await createScan(scan); toast(t("Planilha importada: ")+(scan.meta.oficina||file.name));
  }catch(err){ toast(err && err.message && err.message!=="load" ? err.message : t("Não foi possível ler o arquivo. Use a planilha System Scan original (.xls).")); }
  const f=document.getElementById("xlsfile"); if(f) f.value="";
}

/* ================= gráficos (SVG, paleta de papel) ================= */
const PC={ink:"#1a2026",mute:"#5f6a75",grid:"#e3e7eb",you:"#00569b",mkt:"#9aa5b1",ok:"#1b7f47",warn:"#b87800",bad:"#c0352b",prev:"#1a2026"};
const FONT="'Open Sans', Arial, Helvetica, sans-serif";
function svgWrap(w,h,inner){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="${FONT}"><rect width="${w}" height="${h}" fill="#ffffff"/>${inner}</svg>`; }
function chartScores(secs, prev){
  const W=720, rowH=34, top=26, left=190, right=64, H=top+secs.length*rowH+28, x=v=>left+v*(W-left-right);
  let g="";
  [0,.25,.5,.75,1].forEach(t=>{ g+=`<line x1="${x(t)}" y1="${top-6}" x2="${x(t)}" y2="${H-24}" stroke="${PC.grid}" stroke-width="1"/><text x="${x(t)}" y="${H-8}" font-size="12" fill="${PC.mute}" text-anchor="middle">${t*100}%</text>`; });
  secs.forEach((s,i)=>{
    const y=top+i*rowH, v=s.score||0, col=s.score==null?PC.grid:PC[band(s.score)];
    g+=`<text x="${left-10}" y="${y+rowH/2+4}" font-size="13" fill="${PC.ink}" text-anchor="end">${esc(secShort(s))}</text>`;
    g+=`<rect x="${left}" y="${y+7}" width="${Math.max(0,x(v)-left)}" height="${rowH-14}" rx="3" fill="${col}"/>`;
    g+=`<text x="${x(v)+6}" y="${y+rowH/2+4}" font-size="13" font-weight="bold" fill="${PC.ink}">${s.score==null?"—":Math.round(v*100)+"%"}</text>`;
    const p=prev&&prev.secs[i]; if(p&&p.score!=null){ const px=x(p.score); g+=`<line x1="${px}" y1="${y+3}" x2="${px}" y2="${y+rowH-3}" stroke="${PC.prev}" stroke-width="2.5"/>`; }
  });
  return svgWrap(W,H,g);
}
function chartBars(groups, opt){ // groups: [{label, a, b}] a=você b=mercado
  const W=720, H=260, top=20, bot=44, left=48, right=12, max=Math.max(1,...groups.flatMap(g=>[g.a||0,g.b||0]))*1.15;
  const step=niceStep(max), ymax=Math.ceil(max/step)*step, y=v=>top+(H-top-bot)*(1-v/ymax), gw=(W-left-right)/groups.length, bw=Math.min(46,gw*0.3);
  let g="";
  for(let t=0;t<=ymax+1e-9;t+=step){ g+=`<line x1="${left}" y1="${y(t)}" x2="${W-right}" y2="${y(t)}" stroke="${PC.grid}"/><text x="${left-8}" y="${y(t)+4}" font-size="12" fill="${PC.mute}" text-anchor="end">${opt.fmt(t)}</text>`; }
  groups.forEach((d,i)=>{
    const cx=left+gw*i+gw/2;
    [["a",PC.you,-1],["b",PC.mkt,1]].forEach(([k,col,side])=>{ const v=d[k]||0, bx=cx+(side<0?-bw-3:3);
      g+=`<rect x="${bx}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2" fill="${col}"/><text x="${bx+bw/2}" y="${y(v)-5}" font-size="12" fill="${PC.ink}" text-anchor="middle" font-weight="${k==="a"?"bold":"normal"}">${opt.fmt(v,true)}</text>`; });
    g+=`<text x="${cx}" y="${H-bot+18}" font-size="13" fill="${PC.ink}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  g+=`<line x1="${left}" y1="${y(0)}" x2="${W-right}" y2="${y(0)}" stroke="${PC.ink}"/>`;
  g+=`<rect x="${left}" y="${H-16}" width="10" height="10" fill="${PC.you}"/><text x="${left+15}" y="${H-7}" font-size="12" fill="${PC.ink}">${esc(opt.a)}</text><rect x="${left+150}" y="${H-16}" width="10" height="10" fill="${PC.mkt}"/><text x="${left+165}" y="${H-7}" font-size="12" fill="${PC.ink}">${esc(opt.b)}</text>`;
  return svgWrap(W,H,g);
}
function niceStep(max){ const r=max/5, p=Math.pow(10,Math.floor(Math.log10(r))), n=r/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const fH=(v,lab)=>lab?fmt(v,1):fmt(v,0);
const fP=(v,lab)=>Math.round(v*100)+"%";

/* ================= relatório ================= */
function findPrev(){
  const me=S.scan, key=(me.meta.oficina||"").trim().toLowerCase(); if(!key) return null;
  const cands=S.list.filter(x=>x.id!==S.cur && (x.d.meta?.oficina||"").trim().toLowerCase()===key && (x.d.meta?.data||"")<(me.meta.data||"")).sort((a,b)=>(b.d.meta.data||"").localeCompare(a.d.meta.data||""));
  return cands[0]||null;
}
function reportModel(){
  const c=computeScan(S.scan, ITEMS); const p=findPrev(); const pc=p?computeScan(p.d, ITEMS):null;
  return { c, prev:p, pc, m:S.scan.meta, notes:S.scan.notes||{} };
}

/* ================= exportação (Word e PDF a partir dos mesmos blocos) ================= */
async function svgToPng(svg){
  const img=new Image(); const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const sc=2, cv=document.createElement("canvas"); cv.width=img.width*sc; cv.height=img.height*sc;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  return { data:new Uint8Array(await blob.arrayBuffer()), url:cv.toDataURL("image/png"), w:img.width, h:img.height };
}
const FILLHEX={ok:"E1F2E8",parcial:"FBEFD6",falha:"F9E2DF",acima:"ECE9FB",na:"F1F3F5"};
const safeName = m => `${APPNAME} - ${(m.oficina||"oficina").replace(/[\\/:*?"<>|]/g,"")} - ${m.data||""}`;
async function saveFile(filename, blob){
  try{ await S.downloads.save({filename, data:blob}); toast(t("repSaved")); }
  catch(e){ toast(e && e.code==="declined" ? t("dlCancel") : t("dlFail")); }
}
async function withBusy(btn, fn){ btn.disabled=true; const old=btn.textContent; btn.textContent=t("generating"); try{ await fn(); }catch(e){ console.error(e); toast(t("genFail")); } btn.disabled=false; btn.textContent=old; }
function logoBytes(){ const b=atob(LOGO.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

async function exportDocx(btn){ await withBusy(btn, async()=>{
  if(!window.docx) await loadScript("https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js");
  const D=window.docx, {B,m}=reportBlocks(); const FONTN="Open Sans", BLUE="00569B", MUTE="5F6A75";
  const P=(text,o={})=>new D.Paragraph({spacing:{after:o.tight?40:120}, children:[new D.TextRun({text:String(text),font:FONTN,size:o.small?18:22,color:o.small?MUTE:undefined})]});
  const cell=(t,o={})=>new D.TableCell({width:o.w?{size:o.w,type:D.WidthType.PERCENTAGE}:undefined,shading:o.fill?{type:D.ShadingType.CLEAR,color:"auto",fill:o.fill}:undefined,margins:{top:60,bottom:60,left:100,right:100},
    children:[new D.Paragraph({alignment:o.right?D.AlignmentType.RIGHT:D.AlignmentType.LEFT,children:[new D.TextRun({text:String(t),font:FONTN,size:o.head?17:20,bold:!!o.head,color:o.head?MUTE:"1A2026"})]})]});
  const ch=[];
  for(const b of B){
    if(b.cover){
      ch.push(new D.Paragraph({spacing:{after:480},children:[new D.ImageRun({type:"png",data:logoBytes(),transformation:{width:220,height:32}})]}));
      ch.push(new D.Paragraph({spacing:{after:60},children:[new D.TextRun({text:t("repResults").toUpperCase(),font:FONTN,size:18,bold:true,color:MUTE})]}));
      ch.push(new D.Paragraph({spacing:{after:360},children:[new D.TextRun({text:APPNAME,font:FONTN,size:52,bold:true,color:BLUE})]}));
      b.cover.forEach(([k,v])=>ch.push(new D.Paragraph({spacing:{after:80},children:[new D.TextRun({text:k+":  ",font:FONTN,size:24,color:MUTE}),new D.TextRun({text:v||"—",font:FONTN,size:24,bold:true})]})));
    }
    else if(b.pagebreak) ch.push(new D.Paragraph({children:[new D.PageBreak()]}));
    else if(b.h) ch.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_1,spacing:{before:360,after:160},border:{top:{style:D.BorderStyle.SINGLE,size:12,color:BLUE,space:8}},children:[new D.TextRun({text:b.h[0]+"  ",font:FONTN,size:30,bold:true,color:MUTE}),new D.TextRun({text:b.h[1],font:FONTN,size:30,bold:true,color:"1A2026"})]}));
    else if(b.h3) ch.push(new D.Paragraph({spacing:{before:240,after:100},children:[new D.TextRun({text:b.h3,font:FONTN,size:24,bold:true})]}));
    else if(b.p!=null) ch.push(P(b.p,b));
    else if(b.img){ const p=await svgToPng(b.img); ch.push(new D.Paragraph({spacing:{after:160},children:[new D.ImageRun({type:"png",data:p.data,transformation:{width:600,height:Math.round(600*p.h/p.w)}})]})); }
    else if(b.note) ch.push(new D.Paragraph({spacing:{before:120,after:160},shading:{type:D.ShadingType.CLEAR,color:"auto",fill:"F3F5F7"},border:{left:{style:D.BorderStyle.SINGLE,size:18,color:BLUE,space:8}},
      children:String(b.note).split("\n").flatMap((ln,i)=>[...(i?[new D.TextRun({break:1})]:[]),new D.TextRun({text:ln,font:FONTN,size:21})])}));
    else if(b.photos){
      const cells=[]; for(const f of b.photos){ let data=null; try{ data=await photoBytes(f.id); }catch(e){}
        const w=300, h=Math.min(260, Math.round(w*(f.h||3)/(f.w||4))), ww=Math.round(h*(f.w||4)/(f.h||3));
        cells.push(new D.TableCell({width:{size:50,type:D.WidthType.PERCENTAGE},borders:{top:{style:D.BorderStyle.NONE},bottom:{style:D.BorderStyle.NONE},left:{style:D.BorderStyle.NONE},right:{style:D.BorderStyle.NONE}},margins:{top:80,bottom:160,left:60,right:60},

      const rows=[]; for(let i=0;i<cells.length;i+=2) rows.push(new D.TableRow({cantSplit:true,children:[cells[i], cells[i+1]||new D.TableCell({borders:{top:{style:D.BorderStyle.NONE},bottom:{style:D.BorderStyle.NONE},left:{style:D.BorderStyle.NONE},right:{style:D.BorderStyle.NONE}},children:[new D.Paragraph("")]})]}));

}); }

async function exportPdf(btn){ await withBusy(btn, async()=>{
  if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const {B,m}=reportBlocks(); const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  const PW=210, PH=297, ML=18, MR=18, MT=24, MB=20, CW=PW-ML-MR;
  const T=s=>String(s??"").replace(/≥/g,">=").replace(/≤/g,"<=").replace(/[^\u0000-ÿ–—‘’“”•…]/g,"");
  const hex=h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  const INK=[26,32,38], MUTE=[95,106,117], BLUE=[0,86,155], LINE=[217,222,227];
  let y=MT, firstPage=true;
  const newPage=()=>{ doc.addPage(); y=MT; };
  const need=h=>{ if(y+h>PH-MB) newPage(); };
  const text=(s,{size=10.5,bold=false,color=INK,x=ML,w=CW,lh=1.38,align="left"}={})=>{
    doc.setFont("helvetica",bold?"bold":"normal"); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(T(s),w); const lhmm=size*0.3528*lh;
    lines.forEach(l=>{ need(lhmm); doc.text(l, align==="right"?x+w:x, y+size*0.3528, {align}); y+=lhmm; });
  };
  const logoW=64, logoH=logoW*88/600;
  for(const b of B){
    if(b.cover){
      doc.addImage(LOGO,"PNG",ML,MT,logoW,logoH); y=MT+logoH+34;
      text(t("repResults").toUpperCase(),{size:9,bold:true,color:MUTE}); y+=2;
      text(APPNAME,{size:26,bold:true,color:BLUE,lh:1.15}); y+=10;
      doc.setDrawColor(...BLUE); doc.setLineWidth(0.8); doc.line(ML,y,ML+30,y); y+=8;
      b.cover.forEach(([k,v])=>{ doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...MUTE); doc.text(T(k),ML,y+4);
        doc.setFont("helvetica","bold"); doc.setTextColor(...INK); const ls=doc.splitTextToSize(T(v||"—"),CW-38); doc.text(ls,ML+38,y+4); y+=Math.max(1,ls.length)*5.6+1.5; });
      y+=10;
    }
    else if(b.pagebreak){ newPage(); }
    else if(b.h){ need(22); y+=6; doc.setDrawColor(...BLUE); doc.setLineWidth(0.6); doc.line(ML,y,PW-MR,y); y+=4;
      doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...MUTE); doc.text(T(b.h[0]),ML,y+5.5);
      const off=doc.getTextWidth(T(b.h[0]))+3; doc.setTextColor(...INK); doc.text(T(b.h[1]),ML+off,y+5.5); y+=11; }
    else if(b.h3){ need(14); y+=3; text(b.h3,{size:12,bold:true}); y+=1.5; }
    else if(b.p!=null){ text(b.p,{size:b.small?8.5:10.5,color:b.small?MUTE:INK}); y+=b.tight?0.5:2.5; }
    else if(b.img){ const p=await svgToPng(b.img); const w=CW, h=w*p.h/p.w; need(h+4); doc.addImage(p.url,"PNG",ML,y,w,h); y+=h+4; }
    else if(b.note){ doc.setFont("helvetica","normal"); doc.setFontSize(10); const ls=String(b.note).split("\n").flatMap(ln=>ln.trim()?doc.splitTextToSize(T(ln),CW-10):[" "]); const lh=10*0.3528*1.4;
      let i=0; while(i<ls.length){ need(lh+6); const fit=Math.max(1,Math.min(ls.length-i,Math.floor((PH-MB-y-6)/lh))); const h=fit*lh+6;
        doc.setFillColor(243,245,247); doc.rect(ML,y,CW,h,"F"); doc.setFillColor(...BLUE); doc.rect(ML,y,1.2,h,"F");
        doc.setTextColor(...INK); doc.text(ls.slice(i,i+fit),ML+6,y+3+10*0.3528); y+=h; i+=fit; if(i<ls.length) newPage(); } y+=4; }
    else if(b.photos){
      const gap=6, cw=(CW-gap)/2, maxH=72;
      for(let i=0;i<b.photos.length;i+=2){
        const pair=b.photos.slice(i,i+2); const items=[];
        for(const f of pair){ let data=null; try{ data=await photoBytes(f.id); }catch(e){}
          let w=cw, h=cw*(f.h||3)/(f.w||4); if(h>maxH){ h=maxH; w=h*(f.w||4)/(f.h||3); }
          doc.setFont("helvetica","normal"); doc.setFontSize(9); const ls=f.nota?doc.splitTextToSize(T(f.nota),cw):[];
          items.push({data,w,h,ls}); }
        const rowH=Math.max(...items.map(x=>x.h+(x.ls.length?x.ls.length*4.2+3:0)))+6;
        need(rowH);
        items.forEach((x,k)=>{ const x0=ML+k*(cw+gap);
          if(x.data) doc.addImage(x.data,"JPEG",x0,y,x.w,x.h); else { doc.setFillColor(241,243,245); doc.rect(x0,y,cw,x.h,"F"); }
          if(x.ls.length){ doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(x.ls,x0,y+x.h+4.5); } });
        y+=rowH;
      }
    }
    else if(b.table){
      const t=b.table, ws=t.widths.map(w=>w/100*CW), pad=2, fs=9, lh=fs*0.3528*1.3;
      const drawHead=()=>{ need(9); doc.setFillColor(241,243,245); doc.rect(ML,y,CW,7.5,"F"); doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...MUTE);
        let x=ML; t.head.forEach((h,i)=>{ const r=t.right.includes(i); doc.text(T(h.toUpperCase()), r?x+ws[i]-pad:x+pad, y+5, {align:r?"right":"left"}); x+=ws[i]; });
        y+=7.5; doc.setDrawColor(...INK); doc.setLineWidth(0.35); doc.line(ML,y,PW-MR,y); };
      drawHead();
      doc.setFont("helvetica","normal"); doc.setFontSize(fs);
      for(const r of t.rows){
        const cl=r.cells.map((c,i)=>doc.splitTextToSize(T(c),ws[i]-2*pad)); const h=Math.max(t.tall?9:0, Math.max(...cl.map(l=>l.length))*lh+3.2);
        if(y+h>PH-MB){ newPage(); drawHead(); doc.setFont("helvetica","normal"); doc.setFontSize(fs); }
        let x=ML; cl.forEach((l,i)=>{ if(i===r.fillCol && r.fill){ doc.setFillColor(...hex(r.fill)); doc.rect(x,y,ws[i],h,"F"); }
          const rt=t.right.includes(i); doc.setTextColor(...INK); doc.text(l, rt?x+ws[i]-pad:x+pad, y+1.6+fs*0.3528, {align:rt?"right":"left"}); x+=ws[i]; });
        y+=h; doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(ML,y,PW-MR,y);
      }
      y+=5;
    }
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i);
    if(i>1) doc.addImage(LOGO,"PNG",PW-MR-30,9,30,30*88/600);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...MUTE);
    doc.text(T(`${APPNAME} · ${m.oficina||""} · ${fmtDate(m.data)}`),ML,PH-10); doc.text(T(t("pageOf",{i,n})),PW-MR,PH-10,{align:"right"}); }
  await saveFile(safeName(m)+".pdf", doc.output("blob"));
}); }

const ETAPAS = ["Montagem/Desmontagem","Funilaria","Preparação","Laboratório","Cabine de Pintura","Polimento"];
const blobUrl = id => "/_blob/" + id;
async function prepPhoto(file){
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; }
  catch(e){ src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); w = src.naturalWidth; h = src.naturalHeight; }
  const max = 1600, k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  cv.getContext("2d").drawImage(src, 0, 0, cw, ch);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
  return { blob, w: cw, h: ch };
}
async function addPhotos(files, etapa){
  if(!files.length || !canUploadPhotos()) return;
  const msg = document.getElementById("upmsg"); const scanId = S.cur;
  let ok = 0, fail = null;
  for(let i=0;i<files.length;i++){
    if(msg){ msg.hidden=false; msg.textContent=t("uploading",{i:i+1,n:files.length}); }
    try{
      const p = await prepPhoto(files[i]);
      const r = S.assets ? await S.assets.upload(p.blob, { type: "image/jpeg" }) : await dbPhotoUpload(p.blob);
      if(S.cur !== scanId) break;
      S.scan.fotos = S.scan.fotos || [];
      S.scan.fotos.push({ id: r.id, etapa, nota: "", w: p.w, h: p.h, at: new Date().toISOString(), ...(r.src ? { src: r.src } : {}) });
      ok++; markDirty();
    }catch(e){ fail = e; }
  }
  if(S.cur === scanId && S.tab === "fotos") renderBody();
  if(fail) toast(fail.code==="too_large" ? t("photoBig") : fail.code==="quota_or_state" ? t("photoQuota") : t("photoFail",{n:files.length-ok}));
  else toast(ok===1 ? t("photoAdded") : t("photosAdded",{n:ok}));
}
async function removePhoto(i){
  const f = S.scan.fotos[i]; if(!f) return;
  S.scan.fotos.splice(i, 1); S.confirmFoto = null; markDirty(); renderBody();
  try{ await deletePhotoAny(f); }catch(e){}
  toast(t("photoDeleted"));
}
async function photoBytes(id){
  if(PHOTO_FS || isDbPhoto(id)){ const d=await photoData(id); if(!d) throw new Error("na"); const b=atob(d.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  try{ const r = await fetch(blobUrl(id)); if(r.ok) return new Uint8Array(await r.arrayBuffer()); }catch(e){}
  const im = await new Promise((res, rej) => { const x = new Image(); x.crossOrigin = "anonymous"; x.onload = () => res(x); x.onerror = rej; x.src = blobUrl(id); });
  const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext("2d").drawImage(im, 0, 0);
  const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85)); return new Uint8Array(await b.arrayBuffer());
}

  tocList().forEach((x,i)=>B.push({p:`${i+1}  ${x}`,tight:true}));
  B.push({pagebreak:true});
  B.push({h:["1",t("h_scores")]});
  B.push({img:chartScores(c.secs,pc)});
  B.push({p:t("lgText")+(pc?t("lgPrevText",{d:fmtDate(prev.d.meta.data)}):"")+".",small:true});

  B.push({h:["2",t("h_intro")]}); INTRO_KEYS.forEach(k=>B.push({p:t(k)}));
  B.push({h:["3",t("h_staff")]});
  B.push({h3:t("h31")});
  B.push({table:{head:[t("th_func"),t("th_pess"),t("th_fteP"),t("th_fteA"),t("th_hP")], widths:[40,15,15,15,15], right:[1,2,3,4], rows:staffRows(st)}});
  B.push({h3:t("h32")});
  B.push({p:t("p32",{c:m.carros||0,h:fmt(st.hJob,1),m:marketH(),d:fmt(st.porDia,2)})});
  B.push({img:hoursChart(st)});
  B.push({h3:t("h33")}); B.push({p:t("p33",{a:pct(st.overheadRatio,1),b:pct(MERCADO.overhead)})});
  B.push({h3:t("h34")}); B.push({p:t("p34",{a:pct(st.competencia),b:pct(MERCADO.competencia)})});
  B.push({img:ratioChart(st)});
  B.push({h3:t("h35")}); B.push({p:t("p35",{d:fmt(st.diasDoenca,0),p:pct(st.doenca,1),m:pct(MERCADO.doenca)})});

  if(notes.equipe) B.push({note:notes.equipe});
  SECOES.forEach((s,i)=>{
    B.push({h:[secNum(i), `${secFull(s)}  —  ${pct(c.secs[i].score)}`]});
    B.push({table:{head:[t("th_item"),t("th_is"),t("th_should"),t("th_sit")], widths:[52,15,15,18], right:[1,2], rows:itemRows(c.secs[i])}});
    if(s.key==="layout") vagasBlocks(c.st).forEach(b=>B.push(b));
    if(notes[s.key]) B.push({note:notes[s.key]});
  });
  B.push({h:["10",t("h_prio")]});
  if(c.melhorias.length){ B.push({p:t("prioText")}); B.push({table:{head:[t("th_item"),t("th_area"),t("th_lost")], widths:[58,27,15], right:[2], rows:prioRows(c)}}); }
  else B.push({p:t("prioNone")});
  if(notes.geral){ B.push({h3:t("genNotes")}); B.push({note:notes.geral}); }
  const fotos=S.scan.fotos||[];
  if(fotos.length){ B.push({pagebreak:true}); B.push({h:["11",t("tab_fotos")]}); ETAPAS.forEach((_,e)=>{ const fs=fotos.filter(f=>f.etapa===e+1); if(fs.length){ B.push({h3:`${e+1}. ${etapaName(e+1)}`}); B.push({photos:fs}); } }); }
  B.push({pagebreak:true}); B.push({h:[fotos.length?"12":"11",t("tab_plano")]});
  B.push({table:{head:planoHead(), widths:[5,47,8,11,15,14], right:[0,2], rows:planoRows(), tall:true}});
  return { B, m };
}

function fotosView(){
  const fotos = S.scan.fotos || [];
  const canUp = canUploadPhotos();
  const blocks = ETAPAS.map((_, e) => {
    const et = e + 1, nome = etapaName(et);
    const cards = fotos.map((f, i) => ({f, i})).filter(x => x.f.etapa === et).map(({f, i}) => `
      <figure class="foto">
        <img src="${blobUrl(f.id)}" alt="${t("photoOf")} ${esc(nome)}${f.nota?": "+esc(f.nota):""}" loading="lazy" width="${f.w||4}" height="${f.h||3}">
        <div class="field"><label for="f-fotos-${i}-nota">${t("photoNote")}</label>
          <textarea id="f-fotos-${i}-nota" data-bind="fotos.${i}.nota" rows="2" placeholder="${t("photoPh")}">${esc(f.nota||"")}</textarea></div>
        ${canUp ? `<button type="button" class="btn ghost sm danger" data-rmfoto="${i}">${S.confirmFoto===i?t("photoDelOk"):t("photoDel")}</button>` : ""}
      </figure>`).join("");
    return `<section class="etapa">
      <div class="etapa-h"><span class="n">${et}</span><h2>${esc(nome)}</h2><span class="muted cnt">${t("nPhotosStage",{n:fotos.filter(f=>f.etapa===et).length})}</span></div>
      ${cards ? `<div class="fotos">${cards}</div>` : `<p class="muted vazio">${t("noPhotos")}</p>`}
      ${canUp ? `<div class="actions">
        <button type="button" class="btn primary sm" data-cam="${et}">${ICON_CAM}${t("takePhoto")}</button>
        <button type="button" class="btn sm" data-pick="${et}">${ICON_UP}${t("fromGallery")}</button>
        <input type="file" id="cam-${et}" accept="image/*" capture="environment" data-photo="${et}" class="vh" tabindex="-1" aria-hidden="true">
        <input type="file" id="gal-${et}" accept="image/*" multiple data-photo="${et}" class="vh" tabindex="-1" aria-hidden="true">
      </div>` : ""}
    </section>`;
  }).join("");
  return `<div class="sechead"><div><div class="eyebrow">${t("photosEyebrow")}</div><h1>${t("tab_fotos")}</h1></div></div>
    ${canUp ? `<p class="muted" style="margin-top:-6px">${t("photosIntro")}</p>` : `<p class="notice">${t("photosRO")}</p>`}
    <div id="upmsg" class="notice" hidden></div>
    ${blocks}`;
}
function reportFotosHtml(){
  const fotos = S.scan.fotos || []; if(!fotos.length) return "";
  return `<h2><span>11</span>${t("tab_fotos")}</h2>` + ETAPAS.map((_, e) => {
    const fs = fotos.filter(f => f.etapa === e + 1); if(!fs.length) return "";
    return `<h3>${e+1}. ${esc(etapaName(e+1))}</h3><div class="rfotos">${fs.map(f => `<figure><img src="${blobUrl(f.id)}" alt="${esc(etapaName(e+1))}" loading="lazy">${f.nota?`<figcaption>${esc(f.nota)}</figcaption>`:""}</figure>`).join("")}</div>`;
  }).join("");
}

/* ---------- cálculos ---------- */
function computePerfil(scan, st){
  const m=scan.meta||{}, p=m.perfil||{}, r=toNum(p.pecasRep), s=toNum(p.pecasSub);
  let pc, src;
  if(r!=null && s!=null && r+s>0){ pc=r/(r+s); src="smart"; }
  else { pc=.5; src="est"; }
  const ref={}; ["fun","prep","pint","pol"].forEach(k=>ref[k]=pc*PERFIL_REF.rep[k]+(1-pc)*PERFIL_REF.sub[k]);
  const total=ref.fun+ref.prep+ref.pint+ref.pol, carros=toNum(m.carros)||0, horas=carros*total;
  return { pct:pc, src, ref, total, carros, horas, efic: st && st.hProdTot ? horas/st.hProdTot : null, lab: pc>=.6?"pf_rep_l":pc<=.4?"pf_sub_l":"pf_mix_l" };
}
function computeVagas(scan, st, pf){
  const m=scan.meta||{}, a=m.area||{}, ans=scan.ans||{}, tp=TIPOS[m.tipo]||TIPOS.ind;
  const L=toNum(a.vagaL)||tp.vaga[0], W=toNum(a.vagaW)||tp.vaga[1], m2=L*W;
  const circ=Math.min(90,Math.max(0,toNum(a.circ)||0))/100, prod=toNum(a.prod), estac=toNum(a.estac);
  const nCab = Math.max(0, toNum(ans["84"]) || 0), areaCab = nCab*CABINE_M2, net = prod ? Math.max(0, prod - areaCab) : null;
  const est = prod ? Math.floor(net*(1-circ)/m2+1e-9) : null;
  const d82=toNum(ans["82"]), d83=toNum(ans["83"]);
  const dec = d82==null && d83==null ? null : (d82||0)+(d83||0);
  const eqM = st.fteMetal ? Math.floor(1.5*st.fteMetal)+1 : 0, eqP = st.ftePaint ? Math.floor(1.5*st.ftePaint)+1 : 0, eq=eqM+eqP;
  const dSem=toNum(m.diasSemana), hSem=toNum(m.horasSemana), dias=toNum(m.diasObservados), util=toNum(m.utilizacao) ?? 0.9;
  const hVaga = dSem && hSem && dias ? dias*hSem/dSem*util : 0;
  const tpM = hVaga && pf.carros ? Math.ceil(pf.carros*(pf.ref.fun+pf.ref.pol)/hVaga) : null;
  const tpP = hVaga && pf.carros ? Math.ceil(pf.carros*(pf.ref.prep+pf.ref.pint)/hVaga) : null;
  const park = estac ? Math.floor(estac/(VAGA_EST[0]*VAGA_EST[1])+1e-9) : null;
  return { nCab, areaCab, net, L, W, m2, circ, prod, estac, est, dec, eq, eqM, eqP, hVaga, tpM, tpP, areaNec: eq ? eq*m2/(1-circ) + areaCab : null, park, parkNeed: Math.round(2*st.fteProd), eL:VAGA_EST[0], eW:VAGA_EST[1] };
}
const vagasDiag = v => (v.est==null || !v.eq) ? "" : v.est>=v.eq ? t("vg_ok") : t("vg_bad",{n:v.eq-v.est,a:v.est,b:v.eq});

const cliLocal = {
  all(){ return LS.get("ss-clientes-"+S.country) || {}; },
  put(id, b){ const a=this.all(); a[id]=b; LS.set("ss-clientes-"+S.country, a); },
  del(id){ const a=this.all(); delete a[id]; LS.set("ss-clientes-"+S.country, a); }
};
function clientsFromLocal(){ S.clients = Object.entries(cliLocal.all()).map(([id,d])=>({id,d})); }
function upsertLocalList(arr, id, d){ const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]={id,d}; else arr.push({id,d}); }
async function putClient(id, body){
  try{ if(S.mode==="db") await S.db.doc(colCli()+"/"+id).set(body); else cliLocal.put(id, body); upsertLocalList(S.clients, id, body); return true; }
  catch(e){ toast(t("cliSaveErr")); return false; }
}
async function putScan(id, body){ if(S.mode==="db") await S.db.doc(colScans()+"/"+id).set(body); else localStore.put(id, body); upsertLocalList(S.list, id, body); }

async function saveClient(){
  const d=S.cliDraft||{}; if(!(d.nome||"").trim()){ toast(t("needName")); return; }
  const id = S.cliEdit==="new" ? newId("c") : S.cliEdit;
  const prevC = S.cliEdit!=="new" ? (S.clients.find(x=>x.id===S.cliEdit)||{}).d || {} : {};
  if(S.admin && (d.email||"").trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())){ toast(t("badEmail")); return; }
  const respV = (d.responsavel||"").trim(), emailV = S.admin ? (d.email||"").trim() : (prevC.email||"");
  const body = { nome:d.nome.trim(), tipo:d.tipo||"", pais:cNamePt(S.country), paisCod:S.country, cidade:(d.cidade||"").trim(), responsavel:respV, email:emailV, contato:d.contato||"", obs:d.obs||"", createdAt:d.createdAt||nowIso(), updatedAt:nowIso() };
  if(!await putClient(id, body)) return;
  for(const s of S.list.filter(x=>x.d.meta && x.d.meta.clienteId===id)){
    const m=s.d.meta; if(m.oficina===body.nome && m.cidade===body.cidade && m.pais===body.pais && m.tipo===body.tipo) continue;
    const n=JSON.parse(JSON.stringify(s.d)); Object.assign(n.meta,{oficina:body.nome,cidade:body.cidade,pais:body.pais,tipo:body.tipo});
    try{ await putScan(s.id, n); }catch(e){}
  }
  S.cliEdit=id; S.cliDraft=JSON.parse(JSON.stringify(body)); toast(t("cliSaved")); render();
}
async function deleteClient(){
  if(!S.admin){ toast(t("adminOnly")); return; }
  const id=S.cliEdit; try{ if(S.mode==="db") await S.db.doc(colCli()+"/"+id).delete(); else cliLocal.del(id); S.clients=S.clients.filter(x=>x.id!==id); toast(t("cliDeleted")); }catch(e){ toast(t("Não foi possível excluir.")); }
  S.cliEdit=null; S.cliDraft=null; S.cliConfirmDel=false; render();
}
function openClient(id){
  const c=S.clients.find(x=>x.id===id); S.view="clientes"; S.cliEdit=id; S.cliConfirmDel=false;
  S.cliDraft = c ? JSON.parse(JSON.stringify(c.d)) : {nome:"",tipo:"",pais:S.f.pais||"",cidade:"",responsavel:"",contato:"",obs:""};
  render(); window.scrollTo(0,0);
}
function scanForClient(id){
  const c=S.clients.find(x=>x.id===id), b=blankScan();
  if(c) Object.assign(b.meta,{clienteId:id, oficina:c.d.nome||"", tipo:c.d.tipo||"", pais:c.d.pais||"", cidade:c.d.cidade||"", realizadoPor:c.d.responsavel||""});
  createScan(b);
}
function orphanGroups(){
  const g=new Map();
  for(const x of S.list){ const m=x.d.meta||{}; if(m.clienteId && S.clients.some(c=>c.id===m.clienteId)) continue; const k=lc(m.oficina); if(!k) continue; if(!g.has(k)) g.set(k,[]); g.get(k).push(x); }
  return g;
}
async function importClients(){
  let n=0;
  for(const [k,arr] of orphanGroups()){
    arr.sort((a,b)=>(b.d.meta.data||"").localeCompare(a.d.meta.data||"")); const m=arr[0].d.meta;
    const ex=S.clients.find(x=>lc(x.d.nome)===k); let id;
    if(ex) id=ex.id;
    else { id=newId("c"); if(!await putClient(id,{nome:m.oficina.trim(),tipo:m.tipo||"",pais:m.pais||"",cidade:m.cidade||"",responsavel:m.realizadoPor||"",contato:"",obs:"",createdAt:nowIso(),updatedAt:nowIso()})) return; n++; }
    for(const x of arr){ const b=JSON.parse(JSON.stringify(x.d)); b.meta.clienteId=id; try{ await putScan(x.id, b); }catch(e){} }
  }
  if(S.mode==="local") listFromLocal();
  toast(t("cliCreated",{n})); render();
}
function linkClient(id){
  const m=S.scan.meta, c=S.clients.find(x=>x.id===id); m.clienteId = c ? id : "";
  if(c){ Object.assign(m,{oficina:c.d.nome||"", tipo:c.d.tipo||"", pais:c.d.pais||"", cidade:c.d.cidade||""}); if(!m.realizadoPor && c.d.responsavel) m.realizadoPor=c.d.responsavel; }
  markDirty(); renderBody(); const b=document.querySelector(".brand span"); if(b) b.textContent=m.oficina||t("unnamed");
  if(c) toast(t("cliLinked"));

const uniq = arr => [...new Set(arr.filter(x=>x!=null && String(x).trim()).map(x=>String(x).trim()))].sort((a,b)=>a.localeCompare(b));
const scanYear = d => (d.meta && d.meta.data || "").slice(0,4);
function passScan(d, skip){
  const f=S.f, m=d.meta||{};
  if(f.pais && skip!=="pais" && (m.pais||"")!==f.pais) return false;
  if(f.tipo && (m.tipo||"")!==f.tipo) return false;
  if(f.cidade && (m.cidade||"").trim()!==f.cidade) return false;
  if(f.resp && (m.realizadoPor||"").trim()!==f.resp) return false;
  if(f.ano && scanYear(d)!==f.ano) return false;
  if(f.q && !lc(m.oficina).includes(lc(f.q))) return false;
  return true;
}
function passCli(c, skip){
  const f=S.f;
  if(f.pais && skip!=="pais" && (c.pais||"")!==f.pais) return false;
  if(f.tipo && (c.tipo||"")!==f.tipo) return false;
  if(f.cidade && (c.cidade||"").trim()!==f.cidade) return false;
  if(f.resp && (c.responsavel||"").trim()!==f.resp) return false;
  if(f.q && !lc(c.nome).includes(lc(f.q))) return false;
  return true;
}
const scoreCache = new Map();
function scoreOf(id, d){ const k=id+"|"+(d.updatedAt||""); if(!scoreCache.has(k)){ let c=null; try{ c=computeScan(d, ITEMS); }catch(e){} scoreCache.set(k,c); } return scoreCache.get(k); }
const avgOf = arr => { const v=arr.map(x=>{ const c=scoreOf(x.id,x.d); return c&&c.geral; }).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };

function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function defQty(x){ if(x.it.kind!=="num") return ""; if(x.it.id===127) return Math.max(1, Math.round(x.r.is||0)); return Math.max(1, Math.ceil((x.r.should||0)-(x.r.is||0)-1e-9)); }
function autoText(x, q){
  const it=x.it, r=x.r, l=itemLabel(it).replace(/\s*\?$/,"").replace(/^¿/,"");
  const xs = it.kind==="yn" ? tv(r.is) : fmtIs(it, r.is), ys = fmtShould(it, r.should);
  if(S.lang==="pt" && REC[it.id]) return REC[it.id].replace("{q}", q).replace("{x}", xs).replace("{y}", ys);
  if(QTY.has(it.id)) return t("actQty",{q, u:itemUnit(it), l, x:xs, y:ys});
  return it.kind==="yn" ? t("sugYn",{a:secShort(x.sec), l, x:tv(r.is), y:tv(r.should)}) : t("sugNum",{a:secShort(x.sec), l, x:fmt(r.is, Number.isInteger(r.is)?0:1), y:ys});
}
function autoAction(x){ const prio=prioOf(x), q=defQty(x); return { item:x.it.id, auto:true, edited:false, prio, qtd: QTY.has(x.it.id)?q:"", acao:autoText(x,q), resp:"", prazo:addDays(prio==="alta"?30:prio==="media"?60:90) }; }
function syncPlano(){
  if(!S.scan) return;

  let ch=false;
  for(let i=pl.length-1;i>=0;i--){ const a=pl[i]; if(a.auto && !a.edited && a.item && !bad.has(a.item)){ pl.splice(i,1); ch=true; } }
  const have=new Set(pl.map(a=>a.item).filter(Boolean));
  c.melhorias.forEach(x=>{ if(have.has(x.it.id) || ign.has(x.it.id)) return; pl.push(autoAction(x)); ch=true; });
  pl.forEach(a=>{ if(a.auto && !a.edited && bad.has(a.item)){ const x=bad.get(a.item), n=autoText(x, a.qtd || defQty(x)); if(n!==a.acao){ a.acao=n; ch=true; } } });

}

function fsWrap(fs){
  const wq = q => ({ orderBy:(f,d)=>wq(q.orderBy(f,d)), onSnapshot:(a,b)=>q.onSnapshot(a,b), get:()=>q.get() });
  return { collection:p=>wq(fs.collection(p)), doc:p=>{ const r=fs.doc(p); return { set:b=>r.set(JSON.parse(JSON.stringify(b))), delete:()=>r.delete(), get:()=>r.get(), onSnapshot:(a,b)=>r.onSnapshot(a,b) }; } };
}
async function shrinkToDataUrl(blob){
  const im = await new Promise((res,rej)=>{ const x=new Image(); x.onload=()=>res(x); x.onerror=rej; x.src=URL.createObjectURL(blob); });
  const k=Math.min(1, 1280/Math.max(im.naturalWidth, im.naturalHeight)), cv=document.createElement("canvas");
  cv.width=Math.round(im.naturalWidth*k); cv.height=Math.round(im.naturalHeight*k); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  let q=.75, url=cv.toDataURL("image/jpeg", q); while(url.length>900000 && q>.35){ q-=.1; url=cv.toDataURL("image/jpeg", q); }
  return url;
}

  async delete(id){ delete PHOTO_CACHE[id]; await fs.doc(`paises/${S.country}/fotos/${id}`).delete(); }
}; }
async function photoData(id){
  if(PHOTO_CACHE[id]) return PHOTO_CACHE[id]; if(!S.country) return null;
  try{
    const g=async k=>{ const s=await photoRef(k).get(); return s && s.exists ? (s.data()||{}) : null; };
    const head=await g(id); if(!head || !head.data) return null;
    let d=head.data; for(let i=1;i<(head.n||1);i++){ const c=await g(id+"-"+i); if(!c || !c.data) return null; d+=c.data; }
    PHOTO_CACHE[id]=d; return d;
  }catch(e){ return null; }
}

async function dbPhotoUpload(blob){

  for(let i=n-1;i>=0;i--){ const part=url.slice(i*PHOTO_CHUNK,(i+1)*PHOTO_CHUNK); await photoRef(i?id+"-"+i:id).set(i?{data:part}:{data:part,n,at:nowIso()}); }

}

function openCamera(et){
  const input=document.getElementById("cam-"+et);
  // celular/tablet: abre a câmera nativa (o sistema pede a permissão)
  const coarse = window.matchMedia && matchMedia("(pointer:coarse)").matches;
  if(coarse || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ if(input){ input.value=""; input.click(); } return; }
  // computador: câmera ao vivo com pedido de permissão do navegador
  closeCam();
  const m=document.createElement("div"); m.id="cammodal"; m.className="cam-modal";
  m.innerHTML=`<div class="cam-box" role="dialog" aria-modal="true" aria-label="${esc(t("takePhoto"))}">
    <div class="cam-h"><b>${esc(t("takePhoto"))} · ${esc(etapaName(et))}</b><button type="button" class="btn ghost sm" data-camx="1">${t("cancel")}</button></div>
    <div class="cam-v"><video playsinline autoplay muted></video><p class="cam-msg">${t("camAsk")}</p></div>
    <div class="cam-f"><button type="button" class="btn" data-campick="1">${ICON_UP}${t("fromGallery")}</button><button type="button" class="btn primary" data-camshot="1" disabled>${ICON_CAM}${t("camShot")}</button></div></div>`;
  document.body.appendChild(m);
  const video=m.querySelector("video"), msg=m.querySelector(".cam-msg"), shot=m.querySelector("[data-camshot]");
  m.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b){ if(e.target===m) closeCam(); return; }
    if(b.dataset.camx) closeCam();
    else if(b.dataset.campick){ closeCam(); const g=document.getElementById("gal-"+et); if(g){ g.value=""; g.click(); } }
    else if(b.dataset.camshot){
      const cv=document.createElement("canvas"); cv.width=video.videoWidth; cv.height=video.videoHeight; cv.getContext("2d").drawImage(video,0,0);
      cv.toBlob(bl=>{ closeCam(); if(bl) addPhotos([new File([bl],"camera.jpg",{type:"image/jpeg"})], et); }, "image/jpeg", .9);
    }
  });
  const onKey=e=>{ if(e.key==="Escape"){ closeCam(); document.removeEventListener("keydown", onKey); } }; document.addEventListener("keydown", onKey);
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1440} }, audio:false })
    .then(st=>{ if(!document.getElementById("cammodal")){ st.getTracks().forEach(tr=>tr.stop()); return; } CAM_STREAM=st; video.srcObject=st; msg.hidden=true; shot.disabled=false; shot.focus(); })
    .catch(err=>{ msg.textContent = (err && (err.name==="NotAllowedError" || err.name==="SecurityError")) ? t("camDenied") : t("camNA"); });
}

  async tx(mode, fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tr=db.transaction("docs", mode), q=fn(tr.objectStore("docs")); tr.oncomplete=()=>res(q && q.result); tr.onerror=()=>rej(tr.error); tr.onabort=()=>rej(tr.error); }); }
};

/* ================= Power Apps (code app): documentos numa lista do SharePoint ================= */
let IS_POWERAPPS = false;
function paWrap(B){
  const subs = new Set();
  const refreshAll = () => subs.forEach(s=>s.load());
  let tm=null; const soon = () => { clearTimeout(tm); tm=setTimeout(refreshAll, 400); };
  const parentOf = p => p.split("/").slice(0,-1).join("/");
  const snapDocs = rows => ({ docs: rows.map(r=>({ id:r.path.split("/").pop(), data:()=>r.data })) });
  const query = (col, ord) => ({
    orderBy:(f,d)=>query(col, {f,d}),
    get: async()=>{ const rows=await B.list(col); return snapDocs(rows); },
    onSnapshot(cb, err){
      const s = { load: async()=>{ try{ let rows=await B.list(col); if(ord) rows.sort((a,b)=>{ const x=(a.data||{})[ord.f]||"", y=(b.data||{})[ord.f]||""; return ord.d==="desc" ? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y)); }); cb(snapDocs(rows)); }catch(e){ console.error(e); if(err) err(e); } } };
      subs.add(s); s.load(); const iv=setInterval(s.load, 20000);
      return ()=>{ clearInterval(iv); subs.delete(s); };
    }
  });
  return {
    collection: p => query(p, null),
    doc: p => ({
      set: async b => { await B.set(p, parentOf(p), JSON.parse(JSON.stringify(b))); soon(); },
      get: async () => { const d=await B.get(p); return { exists: d!=null, data: ()=>d }; },
      delete: async () => { await B.del(p); soon(); },
      onSnapshot: () => () => {}
    })
  };
}
